name: Update Metal News Feed (Every 3 Days)

on:
  schedule:
    # Runs at 06:00 UTC every 3 days
    - cron: '0 6 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab anytime

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Latest Rock & Heavy Metal News
        run: |
          python scripts/fetch_metal_news.py

      - name: Commit and Push Updated News
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/metal-news.json
          if git diff --staged --quiet; then
            echo "No news changes detected."
          else
            git commit -m "chore(news): auto-update metal news feed [skip ci]"
            git push origin main
          fi
